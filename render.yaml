databases:
  - name: billboard-db
    plan: free
    databaseName: billboard_db
    user: billboard

services:
  - type: web
    name: billboard
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    preDeployCommand: "python manage.py migrate --noinput && python manage.py create_initial_data"
    startCommand: "gunicorn samplesite.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        fromDatabase:
          name: billboard-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: WEB_CONCURRENCY
        value: "2"
