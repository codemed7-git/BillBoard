{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="card mx-auto" style="max-width: 420px;">
    <div class="card-header bg-primary text-white">
        <h5 class="mb-0">🔑 Вход</h5>
    </div>
    <div class="card-body">
        {% if form.errors %}
            <div class="alert alert-danger">Неверный логин или пароль.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="id_username">Логин</label>
                <input type="text" name="username" autofocus required class="form-control" id="id_username">
            </div>
            <div class="mb-3">
                <label class="form-label" for="id_password">Пароль</label>
                <input type="password" name="password" required class="form-control" id="id_password">
            </div>
            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
    </div>
</div>
{% endblock %}
